name: Testler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest "ruff==0.17.5" shapely
      - run: ruff check ncz tests geodezi kadastro pafta-indeksi-3b/*.py
      - run: pytest -q
      - run: python geodezi/pafta_ve_tolerans.py
      - run: python kadastro/kad.py tests/fixtures/ornek_100.ncz
